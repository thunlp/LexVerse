# J1Bench example: all six official scenarios × 2 cases.
# On first prepare, gated dataset files are downloaded from Hugging Face to
# .lexverse/datasets/j1bench/. Accept the dataset terms and run `hf auth login`.

schema_version: 1

benchmark:
  name: j1bench
  scenarios: [CI, CR, KQ, LC, CD, DD]

model:
  profile: openai
  name: gpt-4o-mini
  parameters:
    temperature: 0
    max_tokens: 512

roles:
  judge:
    max_tokens: 512
  plaintiff:
    max_tokens: 512
  defendant:
    max_tokens: 512

execution:
  limit: 2
  concurrency: 5
  # One official multi-role case may run dozens of model turns.
  timeout_sec: 3600
  max_attempts: 1
  resume: false

evaluation:
  model:
    profile: openai
    name: gpt-4o-mini
