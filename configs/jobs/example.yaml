schema_version: '1.0'
path: ../../user_workspace/tasks/example
agents:
- name: vanilla
models:
  default:
    provider: openai_compatible
    profile: openai
    name: gpt-5.6-terra
    generation_parameters:
      temperature: 0
  verifiers:
  - provider: openai_compatible
    profile: openai
    name: gpt-5.6-terra
    generation_parameters:
      temperature: 0
      max_completion_tokens: 6000
generation:
  limits:
    model_calls: 20
    tool_calls: 30
    active_timeout_sec: 600
    tool_timeout_sec: 60
  context_window_tokens: 131072
  retrieval:
    mode: keyword
