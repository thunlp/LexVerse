# Example for `lexverse run -b plawbench`; plawbench.local.yaml takes precedence.
# Use --agents vanilla for capability enhancement; see README.md for resources.
benchmark:
  name: plawbench
  tasks:
  - id: case_analysis
    limit: 2
  - id: legal_consultation
    limit: 2
  - id: document_generation
    limit: 2
models:
  default:
    provider: openai_compatible
    profile: openai
    name: gpt-4o-mini
    generation_parameters:
      temperature: 0
      max_tokens: 8192
  verifiers:
  - provider: openai_compatible
    profile: openai
    name: gpt-4o-mini
    generation_parameters:
      temperature: 0
      max_tokens: 8192
generation: {}
verification:
  max_attempts: 3
attempts: 1
concurrency: 10
max_retries: 0
agents:
- name: static
schema_version: '1.0'
