# Example for `lexverse run -b dlawbench`; dlawbench.local.yaml takes precedence.
schema_version: '1.0'

benchmark:
  name: dlawbench
  tasks:
  - id: P_WD
    limit: 2
  - id: P_WS
    limit: 2
  - id: P_CS
    limit: 2
  - id: P_CD
    limit: 2

agents:
- name: native

models:
  default:
    provider: openai_compatible
    profile: openai
    name: gpt-4o-mini
    generation_parameters:
      temperature: 0
      max_tokens: 8192
  roles:
    client:
      provider: openai_compatible
      profile: openai
      name: gpt-4o-mini
      generation_parameters:
        temperature: 0
  verifiers:
  - provider: openai_compatible
    profile: openai
    name: gpt-4o
    generation_parameters:
      temperature: 0
      max_tokens: 32768

generation:
  max_turns: 10
  timeout_sec: 1800

verification:
  mode: single
  max_attempts: 3
  timeout_sec: 1800

concurrency: 10
