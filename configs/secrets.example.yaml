# Copy to configs/secrets.local.yaml when using provider: openai_compatible.
# Benchmark configs select a connection with each model definition's profile under models.
# Profiles contain only base_url and api_key; model settings belong in benchmark YAML.
# ${VAR} values are read from environment variables.
# provider: transformers and provider: vllm load weights directly and do not use profiles.
# For gated/private HF models, use HF_TOKEN or saved Hugging Face login credentials.

openai:
  base_url: "https://api.openai.com/v1"
  api_key: ${LEXVERSE_OPENAI_API_KEY}

# Connect to a vLLM server you have already started using provider: openai_compatible.
# This profile does not start a server or load weights.
# Use a placeholder key for an unauthenticated server; otherwise use its real API key.
local_vllm:
  base_url: "http://localhost:8000/v1"
  api_key: local
