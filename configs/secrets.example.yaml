# Purpose: Configure API connection profiles; ${VAR} values come from environment variables.
# Usage: Select a profile in the model configuration when using provider: openai_compatible.
# Local configuration: Copy to secrets.local.yaml, set credentials, and never commit secrets.

openai:
  base_url: "https://api.openai.com/v1"
  api_key: ${LEXVERSE_OPENAI_API_KEY}

# Connect to a vLLM server you have already started using provider: openai_compatible.
# This profile does not start a server or load weights.
# Use a placeholder key for an unauthenticated server; otherwise use its real API key.
local_vllm:
  base_url: "http://localhost:8000/v1"
  api_key: local
