# LexVerse 本地 API 凭据模板
#
# 用法：
#   cp configs/secrets.example.yaml configs/secrets.local.yaml
#   然后编辑 configs/secrets.local.yaml 填入真实值。
#
# secrets.local.yaml 已在 .gitignore 中，不会被提交。
#
# 最少只需一个连接 profile；benchmark 配置通过名称引用它。
# 其它 profile 可选（LexEval / J1Bench / 打分模型可分开配）。
#
# 环境变量替代：
#   export LEXVERSE_OPENAI_API_KEY="sk-xxx"
#   export LEXVERSE_OPENAI_BASE_URL="https://api.openai.com/v1"
# profile 内可用 ${VAR} 语法展开环境变量，例如 api_key: ${LEXVERSE_OPENAI_API_KEY}

openai:
  provider: openai_compatible
  base_url: "https://api.openai.com/v1"
  api_key: ${LEXVERSE_OPENAI_API_KEY}

local_vllm:
  provider: openai_compatible
  base_url: "http://localhost:8000/v1"
  api_key: local
