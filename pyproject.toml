[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexverse"
version = "1.0"
description = "A universe where legal agents learn, act, and are evaluated."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "filelock>=3.0",
    "huggingface_hub>=0.25",
    "jinja2>=3.1",
]

[project.optional-dependencies]
capability-task = [
    "deepagents==0.7.22",
    "langchain[mcp]==1.4.3",
    "langchain-core==1.6.7",
    "langchain-openai==1.6.7",
    "langgraph==1.2.14",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "fastmcp==4.0.11",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "sentence-transformers==3.4.1",
    # macOS arm64 receives FAISS from the shared-OpenMP Conda runtime during setup.
    "faiss-cpu==1.15.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "jieba==0.42.1",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
]
# Model backends.
openai = [
    "openai>=1.0",
]
local-transformers = [
    "openai>=1.0",
    "torch>=2.2",
    # Shared generation API for original Qwen remote code and native Qwen3.
    "transformers==4.51.3",
    "einops>=0.8,<0.9",
    "transformers-stream-generator==0.0.5",
    "tiktoken>=0.5.2",
    "sentencepiece==0.2.0",
    "protobuf",
    "accelerate",
    "huggingface_hub>=0.25",
]
# vLLM 0.11.x keeps Transformers 4.x compatibility with the LawBench/LTP stack.
# Install on hardware supported by vLLM; the default Mac smoke uses Transformers/MPS.
local-vllm = [
    "openai>=1.0",
    "vllm>=0.11,<0.12",
    "huggingface_hub>=0.25",
]

# Benchmarks.
dlawbench = [
    "openai>=1.0",
]
j1bench = [
    "openai>=1.0",
    "huggingface_hub>=0.25",
    "jsonlines>=3.0",
    "requests>=2.0",
    "tqdm>=4.0",
    "numpy>=1.20,<2",
]
# rouge and rouge_chinese share an import path; combined installs may change Rouge scores.
lawbench = [
    "rouge_chinese>=1.0",
    "cn2an>=0.5",
    "jieba>=0.42",
    "numpy>=1.20,<2",
    "nltk>=3.6",
    "pandas>=1.3",
    "opencc-python-reimplemented>=0.1.7",
    "timeout-decorator>=0.5",
    "tqdm>=4.0",
    "pypinyin>=0.49",
    "python-Levenshtein>=0.20",
    "ltp>=4.2",
    "torch>=2.0",
    # The supported LTP stack requires Transformers 4.x.
    "transformers>=4.0,<5",
]
legalworld = [
    "huggingface_hub>=0.25",
    "camel-ai==0.2.90",
    # CAMEL 0.2.90 imports FastMCP from mcp.server (removed in MCP 2.x).
    "mcp>=1.3.0,<2",
    "python-dotenv>=1.0.1",
    "docxtpl>=0.16.7",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "numpy>=1.26",
]
lexeval = [
    "jsonlines>=3.0",
    "jieba>=0.42",
    "rouge>=1.0",
    # Upstream evaluators require NumPy 1.x compatibility.
    "numpy>=1.20,<2",
]
plawbench = [
    "openai>=1.0",
    "json-repair>=0.30",
]

# Development and testing.
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
lexverse = "lexverse.commands.main:main"

[tool.lexverse.macos-arm64]
python-version = "3.12"
conda-packages = [
    "python=3.12.15=hd05a0c4_2_cpython",
    "pytorch=2.14.1=cpu_generic_py312_h32059f8_0",
    "faiss-cpu=1.14.3=hf3d46f2_1",
    "numpy=1.26.4=py312h8442bc7_0",
    "scipy=1.17.1=py312h4519d97_1",
    "scikit-learn=1.9.1=np2py312hda66c2e_1",
    "llvm-openmp=23.1.4=hdb3d66b_0",
    "libopenblas=0.3.34=openmp_h5e6e99c_1",
    "pip",
]
pip-constraints = [
    "torch==2.14.1",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lexverse", "lexverse.*"]
exclude = ["reference_harness*", "tests*", "data*", "docs*"]

[tool.setuptools.package-data]
"lexverse.environments" = ["egress/*", "egress/bin/*"]
"lexverse.capabilities" = ["catalog.yaml"]
"lexverse.benchmarks.dlawbench" = ["catalog.yaml"]
"lexverse.benchmarks.j1bench" = ["patches/*.patch", "catalog.yaml"]
"lexverse.benchmarks.lawbench" = ["patches/*.patch", "catalog.yaml"]
"lexverse.benchmarks.legalworld" = ["catalog.yaml", "patches/*.patch"]
"lexverse.benchmarks.lexeval" = ["patches/*.patch", "catalog.yaml"]
"lexverse.benchmarks.plawbench" = ["patches/*.patch", "catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs upstream cache and/or network (offline-runnable once cached)",
    "live_api: calls a real paid model API; excluded by default",
    "local_hardware: real local backend requiring suitable hardware and cached weights",
]
# Exclude live API tests by default.
addopts = "-m 'not live_api'"
